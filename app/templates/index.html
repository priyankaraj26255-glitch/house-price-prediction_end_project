<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>House Price Predictor</title>
<style>
:root{--bg:#f6f5ff;--card:#fff;--ink:#22223b;--mut:#6b6b83;--pri:#6c5ce7;--bd:#e3e1f7}
@media(prefers-color-scheme:dark){:root{--bg:#14131f;--card:#1e1d2e;--ink:#eeeefc;--mut:#a3a3bd;--bd:#34324f}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:24px}
.wrap{max-width:760px;margin:auto}h1{margin:0 0 4px}p.s{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);font-size:15px}
button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
#out{margin-top:18px;text-align:center;display:none}#price{font-size:40px;font-weight:700;color:var(--pri)}
#err{color:#e17055;margin-top:12px;text-align:center}
</style></head><body><div class="wrap">
<h1>🏠 House Price Predictor</h1><p class="s">Gradient Boosting model · enter property details for an instant estimate</p>
<div class="card"><div class="grid" id="f">
<div><label>Living area (sqft)</label><input name="sqft" type="number" value="1800"></div>
<div><label>Bedrooms</label><input name="bedrooms" type="number" value="3"></div>
<div><label>Bathrooms</label><input name="bathrooms" type="number" value="2"></div>
<div><label>Year built</label><input name="year_built" type="number" value="2005"></div>
<div><label>Lot size (sqft)</label><input name="lot_size" type="number" value="5500"></div>
<div><label>Garage spaces</label><input name="garage_spaces" type="number" value="2"></div>
<div><label>Overall quality (1-10)</label><input name="overall_quality" type="number" value="7"></div>
<div><label>Distance to center (km)</label><input name="dist_to_center_km" type="number" step="0.1" value="6"></div>
<div><label>Pool</label><select name="has_pool"><option value="0">No</option><option value="1">Yes</option></select></div>
<div><label>Neighborhood</label><select name="neighborhood">{% for n in neighborhoods %}<option>{{n}}</option>{% endfor %}</select></div>
</div><button onclick="go()">Predict price</button><div id="err"></div>
<div id="out"><div style="color:var(--mut)">Estimated value</div><div id="price"></div><div id="rng" style="color:var(--mut)"></div></div></div></div>
<script>
async function go(){const d={};document.querySelectorAll('#f [name]').forEach(e=>d[e.name]=e.value);
const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
const j=await r.json();const o=document.getElementById('out');document.getElementById('err').textContent='';
if(!r.ok){o.style.display='none';document.getElementById('err').textContent=j.error;return}
o.style.display='block';document.getElementById('price').textContent=j.formatted;
document.getElementById('rng').textContent='Likely range: $'+j.range_low.toLocaleString()+' – $'+j.range_high.toLocaleString()}
</script></body></html>
